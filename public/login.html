<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hindustan Ledger | Sign in</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,Arial,sans-serif;background:#f5f8fc;color:#102a56}main{width:min(400px,90vw);background:white;padding:34px;border:1px solid #dce6f4;border-radius:18px;box-shadow:0 15px 45px #102a5614}label{display:block;margin:16px 0 6px;font-weight:600}input{box-sizing:border-box;width:100%;padding:14px;border-radius:9px;border:1px solid #ccd8e7;font-size:16px}button{width:100%;border:0;background:#2563eb;color:white;padding:15px;border-radius:9px;margin-top:24px;font-size:16px;cursor:pointer}small{color:#64748b}#error{color:#b91c1c;min-height:20px}</style></head><body><main><h1>Hindustan Ledger</h1><small>Authorized employee sign-in</small><form id="login"><label for="username">Username</label><input id="username" name="username" required autocomplete="username"><label for="password">Password</label><input id="password" type="password" name="password" required autocomplete="current-password"><p id="error" role="alert"></p><button type="submit">Sign in</button></form></main><script src="/login.js"></script></body></html>
